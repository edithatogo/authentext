StylesPath = styles
MinAlertLevel = warning

Packages = Google, Microsoft

# Authentext hard-tell styles cover the expanded maintained surface.
# Google and Microsoft stay on the original distribution doc so this
# expansion does not fail CI on contraction and quote nits in older notes.
[*]
BasedOnStyles = Authentext

[docs/skill-distribution.md]
BasedOnStyles = Google, Microsoft, Authentext

# Pattern catalogs and compiled examples must contain banned phrases.
[references/**]
BasedOnStyles =

[src/**]
BasedOnStyles =

[SKILL.md]
BasedOnStyles =

[SKILL_PROFESSIONAL.md]
BasedOnStyles =

[conductor/tracks/archive/**]
BasedOnStyles =

# Other tracks still use dashes in headings. The Node self-compliance
# scanner owns compiled skill prose.
[conductor/**]
Authentext.EmDash = NO

[conductor/product-guidelines.md]
Authentext.Chatbot = NO

[docs/editorial-policy-boundary.md]
Authentext.Chatbot = NO

[docs/SELF_IMPROVEMENT_WORKFLOW.md]
Authentext.Chatbot = NO

[docs/wikipedia-edit-draft.md]
Authentext.Chatbot = NO
