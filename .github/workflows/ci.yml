name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up shared maintainer toolchain
        uses: ./.github/actions/setup-maintainer-env
        with:
          node-version: '24'
          install-vale: 'true'
          npm-ci: 'true'

      - name: Sync generated outputs
        run: npm run sync

      - name: Run maintainer validation
        run: npm run lint:all && npm run validate

      - name: Run Node tests
        run: npm test

      - name: Verify sync outputs
        run: npm run check:sync
