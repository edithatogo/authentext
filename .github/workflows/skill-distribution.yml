name: Skill distribution validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  behavioral-evaluations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: ./.github/actions/setup-maintainer-env
        with:
          node-version: '20'
          install-vale: 'false'
          npm-ci: 'true'

      - name: Run behavioral evaluations
        run: npm run evaluate -- --output-dir "${RUNNER_TEMP}/authentext-evaluations"

      - name: Upload machine-readable evaluation receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: authentext-evaluation-results
          path: ${{ runner.temp }}/authentext-evaluations/*.json

  portable-spec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install the reference Agent Skills validator
        run: python -m pip install skills-ref==0.1.1

      - name: Validate the portable skill package
        run: agentskills validate "$GITHUB_WORKSPACE"

  github-publish-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Stage the maintained skill surface
        env:
          PREVIEW_ROOT: ${{ runner.temp }}/authentext-skill-preview
        run: |
          mkdir -p "${PREVIEW_ROOT}/skills/authentext/references"
          cp SKILL.md SKILL_PROFESSIONAL.md README.md LICENSE \
            "${PREVIEW_ROOT}/skills/authentext/"
          cp -R references/. "${PREVIEW_ROOT}/skills/authentext/references/"

      - name: Run the experimental GitHub skill publishing preview
        env:
          PREVIEW_ROOT: ${{ runner.temp }}/authentext-skill-preview
        run: |
          git -C "${PREVIEW_ROOT}" init --quiet
          git -C "${PREVIEW_ROOT}" remote add origin \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          cd "${PREVIEW_ROOT}"
          gh skill publish --dry-run

  validate-skill:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Normalize line endings (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git reset --hard HEAD

      - name: Setup Node
        uses: ./.github/actions/setup-maintainer-env
        with:
          node-version: '20'
          install-vale: 'true'
          npm-ci: 'true'

      - name: Sync generated outputs
        run: npm run sync

      - name: Lint, Typecheck and Format
        if: runner.os != 'Windows'
        run: |
          npm run lint:all

      - name: Lint and Typecheck (Windows)
        if: runner.os == 'Windows'
        run: |
          npm run lint
          npm run vale
          npm run lint:js
          npm run typecheck

      - name: Validate repository docs and adapters
        run: npm run validate

      - name: Validate optional host overlays separately
        run: npm run validate:hosts

      - name: Run tests
        run: npm test

      - name: Verify generated outputs are committed
        run: npm run check:sync

      - name: Run skill validation script
        shell: bash
        run: |
          chmod +x scripts/validate-skill.sh
          ./scripts/validate-skill.sh
