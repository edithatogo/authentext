name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Build skill artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up shared maintainer toolchain
        uses: ./.github/actions/setup-maintainer-env
        with:
          node-version: '20'
          install-vale: 'true'
          npm-ci: 'true'

      - name: Sync generated outputs
        run: npm run sync

      - name: Build and validate artifacts
        run: |
          npm run lint:all
          npm test
          npm run validate
          npm run check:sync

      - name: Package release artifacts
        run: |
          mkdir -p release-artifacts/references
          cp SKILL.md release-artifacts/
          cp SKILL_PROFESSIONAL.md release-artifacts/
          cp README.md release-artifacts/
          cp LICENSE release-artifacts/
          cp -R references/. release-artifacts/references/
          tar -czf authentext-skill-artifacts.tar.gz \
            -C release-artifacts \
            SKILL.md SKILL_PROFESSIONAL.md README.md LICENSE references
          (
            cd release-artifacts
            zip -r ../authentext-skill-artifacts.zip \
              SKILL.md SKILL_PROFESSIONAL.md README.md LICENSE references
          )

      - name: Verify packaged artifact surface
        run: |
          test -f authentext-skill-artifacts.tar.gz
          test -f authentext-skill-artifacts.zip
          tar -tzf authentext-skill-artifacts.tar.gz | sort > artifact-contents.txt
          grep -Fx 'SKILL.md' artifact-contents.txt
          grep -Fx 'SKILL_PROFESSIONAL.md' artifact-contents.txt
          grep -Fx 'README.md' artifact-contents.txt
          grep -Fx 'LICENSE' artifact-contents.txt
          grep -Fx 'references/core-patterns.md' artifact-contents.txt
          grep -Fx 'references/technical.md' artifact-contents.txt
          grep -Fx 'references/academic.md' artifact-contents.txt
          grep -Fx 'references/governance.md' artifact-contents.txt
          grep -Fx 'references/reasoning-failures.md' artifact-contents.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: authentext-skill-artifacts
          path: |
            release-artifacts
            authentext-skill-artifacts.tar.gz
            authentext-skill-artifacts.zip
            artifact-contents.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            authentext-skill-artifacts.tar.gz
            authentext-skill-artifacts.zip
