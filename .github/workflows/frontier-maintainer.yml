name: Frontier candidate regeneration

on:
  pull_request:
    paths:
      - '.github/workflows/frontier-maintainer.yml'

permissions:
  contents: read

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/v3.3-frontier-unified-distribution' && github.actor == 'edithatogo'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-maintainer-env
        with:
          node-version: '24'
          install-vale: 'true'
          npm-ci: 'true'
      - name: Reconcile version sources and maintenance regressions
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          p=Path('package.json'); obj=json.loads(p.read_text()); obj['scripts']['lint:js']=obj['scripts']['lint:js'].replace('--ignore-pattern experiments/**','--ignore-pattern "experiments/**"'); p.write_text(json.dumps(obj,indent=2)+'\n')
          for p in Path('src/modules').glob('*.md'):
              p.write_text(re.sub(r'(?m)^version: 3\.2\.0$', 'version: 3.3.0', p.read_text()))
          p=Path('scripts/compile-skill.js'); s=p.read_text(); anchor='  const syncedDate = new Date().toISOString().slice(0, 10);'
          s=s.replace(anchor, '  const pythonPath = path.join(ROOT_DIR, \'pyproject.toml\');\n  if (fs.existsSync(pythonPath)) {\n    const source = fs.readFileSync(pythonPath, \'utf8\');\n    fs.writeFileSync(pythonPath, source.replace(/^version = "[^"]+"$/m, `version = "${version}"`), \'utf8\');\n  }\n\n'+anchor); p.write_text(s)
          p=Path('scripts/check-sync-clean.js'); p.write_text(p.read_text().replace("  'package.json',", "  'package.json',\n  'pyproject.toml',"))
          p=Path('test/identity-metadata.test.js'); s=p.read_text().replace('assert.match(python, /^version = "3\\.2\\.0"$/m);', 'assert.equal(python.match(/^version = "([^"]+)"$/m)?.[1], pkg.version);').replace("test('canonical modules use the package version and Authentext identity', () => {", "test('canonical modules use the package version and Authentext identity', () => {\n  const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));").replace('assert.match(source, /^version: 3\\.2\\.0$/m, filename);', 'assert.equal(source.match(/^version: (.+)$/m)?.[1], pkg.version, filename);'); p.write_text(s)
          p=Path('test/registry-monitor.test.js'); s=p.read_text().replace('  fs.writeFileSync(matrixPath, `${JSON.stringify(fixture())}\\n`);', "  const matrix = fixture();\n  matrix.channels[0].release_version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;\n  fs.writeFileSync(matrixPath, `${JSON.stringify(matrix)}\\n`);"); p.write_text(s)
          Path('.github/workflows/maintainer-reproduction.yml').unlink(missing_ok=True)
          Path('.github/workflows/frontier-maintainer.yml').unlink()
          PY
      - name: Regenerate from source and run all gates
        run: |
          npm run format:fix
          npm run sync
          npm run lint:all
          npm run validate
          npm test
          npm run test:coverage
          npm run check:sync
          npm run build:distribution -- --output "${RUNNER_TEMP}/verified-packages"
      - name: Commit verified source and generated artifacts to the existing PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'fix: reconcile v3.3 versions and regenerate verified artifacts'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/feat/v3.3-frontier-unified-distribution
