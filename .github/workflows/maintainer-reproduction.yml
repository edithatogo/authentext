name: Maintainer reproduction

on:
  pull_request:
    paths:
      - '.github/workflows/maintainer-reproduction.yml'

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-maintainer-env
        with:
          node-version: '24'
          install-vale: 'true'
          npm-ci: 'true'
      - name: Package public source and development toolchain for local reproduction
        run: |
          mkdir -p reproduction
          git archive --format=tar HEAD > reproduction/source.tar
          tar -czf reproduction/dependencies.tar.gz node_modules
          cp "$(command -v node)" reproduction/node
          cp "$(command -v vale)" reproduction/vale
          git rev-parse HEAD > reproduction/source-commit.txt
          node --version > reproduction/node-version.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: maintainer-reproduction
          path: reproduction/
          retention-days: 2
          if-no-files-found: error
