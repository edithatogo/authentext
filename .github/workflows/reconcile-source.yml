name: Reconciliation source
on:
  pull_request:
    paths:
      - '.github/workflows/reconcile-source.yml'
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: c56d9c1e8985f0855d3391b0b30836d5444f1561
          fetch-depth: 0
          persist-credentials: false
      - name: Capture exact source and history
        run: |
          git bundle create "${RUNNER_TEMP}/reconcile-main.bundle" --all
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reconcile-main-source
          path: ${{ runner.temp }}/reconcile-main.bundle
          retention-days: 3
