name: Frontier review snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/frontier-review-snapshot.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Build offline review inputs
        run: |
          npm ci --ignore-scripts
          mkdir -p .review-toolchain
          cp "$(command -v node)" .review-toolchain/node
          git rev-parse HEAD > .review-toolchain/source-sha.txt
          tar --exclude=.git -czf "${RUNNER_TEMP}/authentext-review.tar.gz" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: authentext-offline-review
          path: ${{ runner.temp }}/authentext-review.tar.gz
          retention-days: 3
