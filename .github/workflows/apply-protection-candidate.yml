name: Apply protection candidate

on:
  pull_request:
    paths:
      - '.maintainer/protection-bundle.json'
      - '.github/workflows/apply-protection-candidate.yml'

permissions:
  contents: read

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/protected-edit-pipeline-v3.3'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-maintainer-env
        with:
          node-version: '24'
          install-vale: 'true'
          npm-ci: 'true'
      - name: Apply verified patch to matching source
        id: patch
        run: |
          if [ ! -f .maintainer/protection-bundle.json ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { brotliDecompressSync } from 'node:zlib';
          import { execFileSync } from 'node:child_process';
          const manifest = JSON.parse(fs.readFileSync('.maintainer/protection-bundle.json', 'utf8'));
          const hash = (data) => crypto.createHash('sha256').update(data).digest('hex');
          if (manifest.schemaVersion !== 1 || !/^[a-f0-9]{40}$/.test(manifest.baseCommit)) throw new Error('Invalid patch metadata');
          execFileSync('git', ['merge-base', '--is-ancestor', manifest.baseCommit, 'HEAD']);
          for (const [file, expected] of Object.entries(manifest.expectedFiles)) {
            if (file.startsWith('/') || file.includes('..') || file.includes('\\') || file.startsWith('.git/')) throw new Error('Invalid file path');
            const exists = fs.existsSync(file);
            if (expected === null ? exists : !exists || hash(fs.readFileSync(file)) !== expected) throw new Error(`Source changed: ${file}`);
          }
          const patch = brotliDecompressSync(Buffer.from(manifest.brotliBase64, 'base64'), { maxOutputLength: 2000000 });
          if (hash(patch) !== manifest.patchSha256) throw new Error('Patch digest mismatch');
          const filename = `${process.env.RUNNER_TEMP}/protection.patch`;
          fs.writeFileSync(filename, patch);
          execFileSync('git', ['apply', '--check', filename]);
          execFileSync('git', ['apply', '--index', filename]);
          NODE
          echo 'available=true' >> "$GITHUB_OUTPUT"
      - name: Verify all changes before committing
        if: steps.patch.outputs.available == 'true'
        run: |
          npm run format:fix
          node node_modules/prettier/bin/prettier.cjs --write experiments/ablation-harness.js
          npm run sync
          npm run lint:all
          npm run validate
          npm test
          npm run test:coverage
          npm run check:sync
          npm run build:distribution -- --output "${RUNNER_TEMP}/authentext-packages"
      - name: Commit to unchanged review branch only
        if: steps.patch.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          test "${HEAD_BRANCH}" = 'feat/protected-edit-pipeline-v3.3'
          actual=$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add references/protection.md
          git -c core.hooksPath=/dev/null commit -m 'feat: verified scientific syntax shield and discourse preservation checks'
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${authorization}" push origin "HEAD:${HEAD_BRANCH}"
